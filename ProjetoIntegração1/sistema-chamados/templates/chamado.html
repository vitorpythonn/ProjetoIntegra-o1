<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abrir Chamado - Sistema de Chamados</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="topbar">
        <div class="container topbar-content">

            <div>
                <h1>Sistema de Chamados</h1>
                <p>Controle de suporte técnico</p>
            </div>

            <nav class="nav-menu">
                <a href="{{ url_for('chamados') }}">Chamados</a>
                <a href="{{ url_for('logout') }}">Sair</a>
            </nav>

        </div>
    </header>

    <main class="container">

        <section class="page-header">

            <div>
                <span class="page-label">SUPORTE</span>

                <h2>Abrir novo chamado</h2>

                <p>
                    Informe os dados do problema para registrar uma solicitação.
                </p>
            </div>

        </section>

        <section class="card">

            {% if erro %}
                <div class="alert alert-error">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST" id="chamado-form">

                <div class="form-grid">

                    <div class="form-group form-group-full">
                        <label for="titulo">Título</label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            placeholder="Ex.: Computador não liga"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="categoria_id">Categoria</label>

                        <select id="categoria_id" name="categoria_id" required>
                            <option value="">Selecione a categoria</option>

                            {% for categoria in categorias %}
                                <option value="{{ categoria.id }}">
                                    {{ categoria.nome }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade" name="prioridade" required>
                            <option value="">Selecione a prioridade</option>
                            <option value="Baixa">Baixa</option>
                            <option value="Media">Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Critica">Crítica</option>
                        </select>
                    </div>

                    <div class="form-group form-group-full">
                        <label for="descricao">Descrição</label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            rows="7"
                            maxlength="1000"
                            placeholder="Descreva detalhadamente o problema..."
                            required
                        ></textarea>
                    </div>

                </div>

                <div class="form-actions">

                    <a
                        href="{{ url_for('chamados') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Abrir chamado
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
